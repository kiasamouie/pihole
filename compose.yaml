# Pi-hole v6 (Docker) - the TVGuard box's DNS + privacy sink.
# Docs: https://docs.pi-hole.net/docker/  https://docs.pi-hole.net/docker/configuration/
#
# Design notes:
# - Pinned to a specific stable image tag (2026.09.0 = FTL v6.7.1, includes
#   security fixes for GHSA-2794-hrj8-5jg9 and others). No `latest`, no `nightly`.
# - Host ports 53/tcp+udp and 3001/tcp are published on PIHOLE_BIND_IP (this
#   box's LAN IP, from .env) so they are not reachable on other interfaces in
#   dual-NIC/public-WAN deployments. 3001/tcp is ALWAYS additionally bound on
#   loopback for the local API (scripts, health checks).
#   The upstream host firewall (UFW) must allow 53/tcp+udp and 3001/tcp from
#   the LAN subnet only; bootstrap verifies, it never configures UFW itself.
# - 3443/tcp maps the container's self-signed HTTPS admin (443). Browsers show
#   a cert warning (CN=pi.hole) - expected for a self-hosted admin.
# - DHCP is DISABLED: no 67/udp mapping, no NET_ADMIN capability.
#   The upstream router remains the only DHCP server.
# - Config/state persists in ./etc-pihole (git-ignored).
# - Admin password comes from .env (git-ignored, mode 600) via
#   FTLCONF_webserver_api_password - the v6 "single source of truth" mechanism.
# - The top-level project name is path-independent; bootstrap also forces it on
#   the CLI so an inherited COMPOSE_PROJECT_NAME cannot override deployment.

name: tvguard

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Upstream resolvers: Cloudflare (primary), Quad9 (secondary; also
      # provides upstream malware-domain blocking). Both are maintained,
      # privacy-respecting, and do not serve ads/telemetry for lookups.
      FTLCONF_dns_upstreams: "1.1.1.1;9.9.9.9"
      # Container sits on a docker bridge; ALL makes FTL listen on every
      # interface inside the container (required in bridge mode).
      FTLCONF_dns_listeningMode: ALL
    ports:
      - "${PIHOLE_BIND_IP:?set PIHOLE_BIND_IP in .env}:53:53/tcp"
      - "${PIHOLE_BIND_IP:?set PIHOLE_BIND_IP in .env}:53:53/udp"
      - "${PIHOLE_BIND_IP:?set PIHOLE_BIND_IP in .env}:3001:80/tcp"
      - "127.0.0.1:3001:80/tcp"
      - "${PIHOLE_BIND_IP:?set PIHOLE_BIND_IP in .env}:3443:443/tcp"
    volumes:
      - ./etc-pihole:/etc/pihole
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
