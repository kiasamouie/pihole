#
# TVGuard privacy policy - source of truth for Samsung-TV privacy blocking.
#
# This file is the ONLY place deny decisions live. scripts/privacy-policy-
# build.py resolves the domains to IPs (via an external resolver, NOT the
# local Pi-hole) and emits data/privacy-policy/resolved.json; scripts/
# tvguard-apply.sh then renders the nftables part and privacy-policy-apply.sh
# pushes the domain part into the dedicated Pi-hole group "TVGuard-Privacy".
#
# Tiers (per entry, `tiers:` list) - one source of truth, no duplicated lists:
#   standard : in standard, standard-no-voice and strict
#   voice    : in standard-no-voice and strict (NOT in plain standard)
#   strict   : in strict only
#
# Profiles (what the user can enable):
#   standard          = ACR + advertising + high-confidence telemetry
#                       + DNS/DoT enforcement. Bixby voice stays functional.
#   standard-no-voice = standard + confirmed Bixby/voice cloud blocking.
#                       NO low-confidence strict telemetry, NO DoH-IP set.
#                       NOTE: intentionally breaks cloud voice recognition.
#   strict            = standard-no-voice + lower-confidence telemetry +
#                       known-DoH-endpoint IP blocking.
#
# Rules followed when building this list (see reports/07 and docs/FINAL_BLOCKING_PLAN.md):
#   * EXACT domains only. No *.samsung.com / *.samsungcloudsolution.com style
#     wildcards - those families contain app-store, auth, EPG, update and
#     QBE infrastructure whose blockage is documented by the community.
#     ONE documented exception: `kind: suffix` entries, permitted only when
#     certificate-transparency + local traffic evidence proves the whole zone
#     serves a single purpose (currently: the aibixby.com Bixby/AI-assistant
#     family, see reports/09-voice-path-investigation.md). Suffix entries are
#     enforced at the DNS layer (Pi-hole regex, group-scoped) with a resolved
#     IP set as second layer; they never touch other profiles.
#   * Every entry carries sources + confidence. Entries that appear only in
#     our own capture still qualify (observed on THIS TV) but are marked so.
#   * Domains in config/privacy-keep.yaml override everything (keep wins).
#

updated: "2026-09-21"
