  voice:
    description: >
      Samsung Bixby / AI-assistant cloud infrastructure. In standard-no-voice
      and strict. Blocking these endpoints intentionally breaks cloud voice
      recognition; normal apps/CDN are unaffected because the aibixby.com
      family hosts nothing else (see below). v2 (2026-09-21, after the
      Tokyo-weather regression R-001/R-002): the TV's live voice path was
      found to be prdcore1-euw1-user.aibixby.com (Bixby EU user plane, AWS
      eu-west-1 ELB), which the original two-host policy missed. The scoped
      aibixby.com suffix below closes that gap. We still do NOT touch
      bixbyllm.com / sbixby.com (no local evidence this TV uses them) or any
      generic *voice/*assistant name.
    default: false
    entries:
      # Scoped suffix policy (the documented `kind: suffix` exception).
      # Evidence: crt.sh 2026-09-21 (83 unique names under aibixby.com -
      # all Bixby user planes, ucs, provisioning/mgmt, oauth, partner
      # services, LLM gateways; NO app-store/OTA/content infrastructure),
      # plus local capture (TV resolves+connects to user-plane hosts on
      # every voice use). Primary control = Pi-hole regex (group-scoped);
      # `hosts:` are resolved for the second-layer nft IP set (keep-list
      # IP collisions auto-excluded). New subdomains added by Samsung later
      # are still stopped at the DNS layer by the regex.
      - domain: aibixby.com
        kind: suffix
        tiers: [voice]
        confidence: high
        observed_locally: true
        hosts:
          - prdcore1-euw1-user.aibixby.com
          - prd-euw1-user.aibixby.com
          - prd-euw1-ucs.aibixby.com
          - prd-euw1-bac.aibixby.com
          - prd-euw1-pdss-sync.aibixby.com
          - prd-use2-ucs.aibixby.com
          - prd-use2-user.aibixby.com
          - prd-use2-bhp-api.aibixby.com
          - prd-apne2-ucs.aibixby.com
          - prd-apne2-user.aibixby.com
          - provisioning-use2.mgmt.aibixby.com
          - bixby-client.aibixby.com
          - bixby-developer-assets.aibixby.com
        sources: [local-capture, crtsh-2026-09, hagezi, perflyst]
        expected_breakage: "cloud Bixby voice/assistant intentionally broken (intended); no app/CDN impact - zone is Bixby-only per CT analysis"
      # Kept as explicit exact entries (also covered by the suffix regex):
      - domain: prd-euw1-ucs.aibixby.com
        tiers: [voice]
        confidence: high
        observed_locally: true
        sources: [local-capture]
        expected_breakage: "cloud voice recognition stops (intended in standard-no-voice/strict)"
      - domain: provisioning-use2.mgmt.aibixby.com
        tiers: [voice]
        confidence: high
        observed_locally: true
        sources: [local-capture, marq24]
        expected_breakage: "voice service provisioning stops (intended in standard-no-voice/strict)"

  doh:
    description: >
      Known public DNS-over-HTTPS/DoT endpoint domains (from the HaGeZi DoH
      list snapshot). At build time these are resolved to IPs and blocked in
      nftables for the target TVs ONLY in strict mode, AFTER excluding any IP
      that is also used by a keep-list/essential domain (keep wins). Expect
      this list to shrink or empty out: DoH endpoints (dns.google,
      one.one.one.one...) share infrastructure with content CDNs, and an IP
      that also serves YouTube must never be dropped. If it empties, DoH is
      reported as PARTIALLY CONTROLLED (DNS is still forced + logged).
    default: false
    entries:
      - domain: dns.google
        tiers: [strict]
        confidence: medium
        observed_locally: false
        sources: [hagezi-doh]
        expected_breakage: "only if an IP unique to DoH is identified"
