  doh:
    description: >
      Known public DNS-over-HTTPS/DoT endpoint domains (from the HaGeZi DoH
      list snapshot). At build time these are resolved to IPs and blocked in
      nftables for the target TVs ONLY in strict mode, AFTER excluding any IP
      that is also used by a keep-list/essential domain (keep wins). Expect
      this list to shrink or empty out: DoH endpoints (dns.google,
      one.one.one.one...) share infrastructure with content CDNs, and an IP
      that also serves YouTube must never be dropped. If it empties, DoH is
      reported as PARTIALLY CONTROLLED (DNS is still forced + logged).
