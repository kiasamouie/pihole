# Structural (non-domain) enforcement. Implemented by tvguard-apply.sh from
# the privacy state file; no per-domain resolution needed.
structural:
  dns_53: "FORCE - TV -> any external :53 (udp/tcp) is DNAT'd to the local Pi-hole (existing TVGuard baseline, active in all modes; this is what makes hard-coded resolvers ineffective)"
  dot_853: "DROP in ALL profiles (standard, standard-no-voice, strict) - tcp+udp, new connections, logged as TVGUARD-DOT"
  doh_ips: "DROP in strict only, resolved at build time, keep-list overlap excluded"
  quic: "NEVER blocked - UDP/443 must remain usable for YouTube/streaming"
  https_443: "NEVER blocked"
