#
# config/lgtv/privacy-policy.yaml - LG webOS TV privacy blocking (LG vendor instance).
#
# This is the LG equivalent of config/privacy-policy.yaml (Samsung). The build
# (scripts/privacy-policy-build.py) resolves these domains per vendor; the
# firewall part renders into the per-vendor nftables sets (tv_privacy_lg /
# tv_privacy_blocked_lg) and the DNS part pushes into the per-vendor Pi-hole
# group "TVGuard-Privacy-LG". The Samsung instance is untouched and lives on
# its own files/group/state line.
#
# Tiers (per entry, `tiers:` list) - same semantics as the Samsung policy:
#   standard : in standard, standard-no-voice and strict
#   voice    : in standard-no-voice and strict (NOT in plain standard)
#   strict   : in strict only
#
# Profiles:
#   standard          = ACR + advertising + high-confidence telemetry
#                       + DNS forcing + DoT enforcement.
#   standard-no-voice = standard + confirmed LG voice-cloud blocking.
#   strict            = standard-no-voice + lower-confidence (DNS-only)
#                       datacentre-cluster twins + known-DoH-endpoint IPs.
#   manufacturer-lockdown = standard-no-voice + LG deny-by-default zones
#                       (config/lgtv/manufacturer.yaml) + essential LG
#                       allowlist (config/lgtv/manufacturer-keep.yaml).
#                       RECOMMENDED profile for this TV.
#
# Evidence hierarchy (research/lg/ - 2026-09-22):
#   local-capture        observed on THIS TV (Pi-hole history / captures) - not yet
#                        collected (the LG is not on the network yet); every entry
#                        below is therefore externally sourced and must be validated
#                        against a local baseline before final sign-off.
#   safenetiot-imc2024   IMC 2024 paper + SafeNetIoT/ACR repo (LG ACR experiments)
#   furkan-safe          furkan-bayrak/lg-tv-blocklist src/safe.txt (live-traffic-verified on a G1)
#   furkan-strict        same repo src/strict.txt (DNS-verified, weak evidence)
#   hagezi               hagezi/dns-blocklists + its Sept-2026 issue history
#   perflyst             Perflyst/PiHoleBlocklist SmartTV LG section + issues
#   level1techs          Level1Techs "LG TV Block" mini-how-to (rooted G5 - candidate evidence only)
#   lg-official          LG privacy statement 2026-09-12 (ACR / Alphonso / cross-device ads)
#
# Rules: EXACT domains only, EXCEPT the documented `kind: suffix` exception
# (same mechanism as Samsung's aibixby.com voice family): allowed only when
# research proves the zone is a single-purpose family. For LG that is
# lgsmartad.com (dedicated ad zone) and alphonso.tv (the ACR/ad vendor
# zone with ROTATING host names eu-acrX.alphonso.tv - suffix control is the
# only reliable way to catch the rotating names; see research/lg/safenetiot-lg.md).
# Domains in config/lgtv/privacy-keep.yaml override everything (keep wins).

applies_to:
  [] # EMPTY until the LG is discovered on the network. The engine treats an
     # empty list as "vendor inactive": the build resolves the policy, but
     # applying errors with a clear message and no firewall/Pi-hole objects
     # are created for this vendor. After discovery (scripts/discover-lan.sh),
     # add the LG's IP here AND to TVS in config/tvguard.conf.

updated: "2026-09-22"
version: 1

policies:

  acr:
    description: >
      LG Automatic Content Recognition. IMC 2024 (SafeNetIoT/ACR) proves LG
      webOS runs Shazam-like content matching to Alphonso (LG's ACR/ad
      vendor since Jan 2022, replacing Gracenote/Unruly). Critical
      implementation detail: the ACR host name is a SINGLE host per region
      whose numeric suffix ROTATES PERIODICALLY (eu-acrX.alphonso.tv in the
      EU, tkacrX.alphonso.tv in the US). Exact-name lists therefore silently
      stop blocking when LG rotates the number - this is why the suffix
      entry below is the primary control. The ACR beacon also moved from
      bare cdpbeacon.lgtvcommon.com (now NXDOMAIN) to the eic/aic/kic
      datacentre-cluster twins, which are included as exact entries.
    default: false
    entries:
      - domain: alphonso.tv
        kind: suffix
        tiers: [standard]
        confidence: high
        observed_locally: false
        hosts:
          - eu-acr1.alphonso.tv
          - tkacr1.alphonso.tv
          - choice.alphonso.tv
        sources: [safenetiot-imc2024, lg-official, hagezi, perflyst, samsapti]
        expected_breakage: "none to playback - ACR viewing recognition + ad vendor endpoints only (rotating eu-acrX names covered by the suffix)"
      - domain: eu-acr1.alphonso.tv
        tiers: [standard]
        confidence: high
        observed_locally: false
        sources: [safenetiot-imc2024, perflyst, dig-2026-09-22]
        expected_breakage: "none - EU ACR endpoint (current name; also covered by the suffix)"
      - domain: tkacr1.alphonso.tv
        tiers: [standard]
        confidence: medium
        observed_locally: false
        sources: [safenetiot-imc2024, perflyst, dig-2026-09-22]
        expected_breakage: "none - US ACR endpoint (regional completeness; also covered by the suffix)"
      - domain: cdpbeacon.lgtvcommon.com
        tiers: [standard]
        confidence: high
        observed_locally: false
        sources: [furkan-strict, safenetiot-imc2024]
        expected_breakage: "none - legacy ACR beacon (decommissioned/NXDOMAIN 2026-09-12; kept for the audit record)"
      - domain: eic.cdpbeacon.lgtvcommon.com
        tiers: [standard]
        confidence: medium
        observed_locally: false
        sources: [furkan-strict, dig-2026-09-22]
        expected_breakage: "none - EU-cluster ACR beacon (current location of the 6-min heartbeat)"
      - domain: aic.cdpbeacon.lgtvcommon.com
        tiers: [standard]
        confidence: medium
        observed_locally: false
        sources: [furkan-strict]
        expected_breakage: "none - Americas-cluster ACR beacon (regional completeness)"
      - domain: kic.cdpbeacon.lgtvcommon.com
        tiers: [standard]
        confidence: medium
        observed_locally: false
        sources: [furkan-strict]
        expected_breakage: "none - Korea-cluster ACR beacon (regional completeness)"

