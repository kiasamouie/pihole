# the per-vendor state lines; identical semantics to the Samsung instance.
structural:
  dns_53: "FORCE - LG -> any external :53 (udp/tcp) is DNAT'd to the local Pi-hole. NOTE: webOS runs its own DNS stub on 127.0.0.1:53 and hardcodes 8.8.8.8/1.1.1.1 (research/lg/lg-tv-blocklist.md) - this DNAT is what makes those hard-coded resolvers ineffective."
  dot_853: "DROP in ALL profiles - tcp+udp, new connections, logged as TVGUARD-DOT-LG"
  doh_ips: "DROP in strict only, resolved at build time, keep-list overlap excluded"
  quic: "NEVER blocked - UDP/443 must remain usable for streaming"
  https_443: "NEVER blocked"
