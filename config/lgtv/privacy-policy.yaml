      which ALSO carries the TV's time sync (SDP handshake), store
      communications and DRM - that zone is network-layer INSEPARABLE from
      essential function, so it must NOT be blocked (blocking it = clock
      stuck at 2021 -> all TLS fails; the furkan-bayrak repo's own
      documented breakage, 2026-09-16). What this tier blocks: the
      standalone voice hosts. Expected consequence: cloud voice
      recognition/search degrades or fails - intended in
