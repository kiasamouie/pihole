#
# manufacturer-keep.yaml - ESSENTIAL Samsung infrastructure for the
# manufacturer-lockdown profile. KEEP WINS over the deny-by-default zones.
#
# Every host here:
#   1. is pushed as a group-scoped Pi-hole ALLOW row - FTL allow beats deny,
#      so the plain zone regex cannot block it (the FTL build's regex validator
#      rejects lookaround, so there is no regex-side exemption); and
#   2. shields the name against a gravity/baseline block of the same name.
# Keep-wins is proven end-to-end by privacy-policy-selftest.sh (the keep host
# must still resolve for the mock client under manufacturer-lockdown).
#
# Only hosts INSIDE a deny_default_zone (config/manufacturer.yaml) belong here;
# the build fails otherwise. Sublabels of a kept host (e.g. x.time.…) are NOT
# auto-allowed - if the TV ever needs one, allow it explicitly via
#   scripts/manufacturer-review.sh keep <domain> [reason]
#
# Each entry documents WHY it stays allowed (no invisible allow decisions).
#
keeps:

  # --- time / content delivery ------------------------------------------------
  - domain: time.samsungcloudsolution.com
    feature: "time sync"
    reason: "Perflyst/fightback: blocking breaks Plex/YouTube/Prime Video on Samsung TVs"
    evidence: "local-capture + perflyst comment (#time.samsungcloudsolution.com)"
    sources: [local-capture, perflyst, fightback]
    date: "2026-09-21"
    confidence: high

  - domain: cdn.samsungcloudsolution.com
    feature: "content delivery / system update checks"
    reason: "Perflyst comment: system update check; observed in local capture"
    evidence: "perflyst comment (#cdn.samsungcloudsolution.com) + local-capture"
