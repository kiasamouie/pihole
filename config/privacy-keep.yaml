#
# TVGuard privacy KEEP list - domains (and their resolved IPs) that MUST
# override any deny candidate. The build step resolves these through an
# external resolver too; any deny candidate whose IP collides with a keep
# domain's IP is excluded from the firewall set and reported in the preview.
#
# Nothing here is a judgement that the domain is "safe" - it is the
# documented cost/benefit decision: the privacy loss is accepted because
# blocking the alternative would break a TV function we need.
#
# Source key:
#   local-capture            observed on this Samsung (reports/06 + captures/)
#   perflyst / fightback     maintained community lists w/ breakage annotations
#   hagezi                   HaGeZi native Samsung list (membership only)
#   samsung-observed-flow    long-lived flow seen in conntrack/flow data
#
keeps:

  # --- YouTube / Google content (never touch CDN/API paths) -----------------
  - domain: www.youtube.com
    reason: "YouTube app/API"
    sources: [local-capture]
  - domain: i.ytimg.com
    reason: "YouTube image CDN"
    sources: [local-capture]
  - domain: yt3.ggpht.com
    reason: "YouTube thumbnails"
    sources: [local-capture]
  - domain: yt3.googleusercontent.com
    reason: "YouTube images"
    sources: [local-capture]
  - domain: lh3.googleusercontent.com
    reason: "Google images (app icons)"
    sources: [local-capture]
  - domain: www.gstatic.com
    reason: "Google static content"
    sources: [local-capture]
  - domain: rr1---sn-8pgbpohxqp5-aige7.googlevideo.com
    reason: "YouTube video CDN (observed host)"
    sources: [local-capture]
  - domain: rr2---sn-8pgbpohxqp5-aige7.googlevideo.com
    reason: "YouTube video CDN (observed host)"
    sources: [local-capture]
  - domain: rr2---sn-8pgbpohxqp5-aigk.googlevideo.com
    reason: "YouTube video CDN (observed host)"
    sources: [local-capture]
  - domain: rr6---sn-8pgbpohxqp5-aigk.googlevideo.com
