# and Perflyst/PiHoleBlocklist (SmartTV.txt, LG section + alphonso.tv).
#
# Research date: 2026-09-22. Companion docs: lg-tv-blocklist.md, perflyst-lg.md.
#
# source_rank legend:
#   A = peer-reviewed (none exist in this space)
#   B = maintained tracker with documented, reproducible methodology
#   C = community source with observations (querylogs, issue reports, journalistic)
#   D = anecdotal / unverified
#
# suggested_action legend:
#   BLOCK    = proven telemetry/ad; blocking verified safe or high privacy value with no breakage evidence
#   KEEP     = blocking breaks TV function (time sync, store, billing, OTA) — do not block
#   OPTIONAL = user's call (dual-use, feature-kill trade-off, unverified function, family risk)
#   UNKNOWN  = function unproven
#
# wildcard: true means the record is a pattern/zone anchor, or an enumerated host set that
# behaves like a pattern. "justified" states whether the pattern is evidence-backed.
#
# Overlapping domains (present in both sources) are merged into ONE record listing all
# sources; per-source file/line references are kept in `source`.

