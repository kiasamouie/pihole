#   ISS_11474    = https://github.com/hagezi/dns-blocklists/issues/11474
#   ISS_11432    = https://github.com/hagezi/dns-blocklists/issues/11432
#   ISS_11412    = https://github.com/hagezi/dns-blocklists/issues/11412
