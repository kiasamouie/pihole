# LG webOS tracking / telemetry / functional-infrastructure inventory
# Generated: 2026-09-22. Sources fetched 2026-09-21/22 (see `source` per entry).
#
# source_rank:  A = peer-reviewed | B = maintained tracker list with stated methodology
#               C = community source with real observations (captures/reverse engineering)
#               D = anecdotal / unverified
# suggested_action: BLOCK | KEEP | OPTIONAL | UNKNOWN
#   BLOCK    = block at DNS (ad/tracking, low breakage risk)
#   KEEP     = must remain reachable (breakage or security risk if blocked)
#   OPTIONAL = user choice; real functional or security trade-off
#   UNKNOWN  = purpose unestablished; no action
#
# Wildcards: flagged in `notes` with justification. Prefer exact hostnames otherwise.
#
# Key URLs:
#   HAGEZI_RAW   = https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/native.lgwebos.txt
